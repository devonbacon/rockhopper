html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #03040a;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen: --p runs 0..1 with the download. */
#status {
	position: absolute;
	inset: 0;
	overflow: hidden;
	visibility: hidden;
	user-select: none;
	transition: opacity 0.5s ease;
	will-change: opacity;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#status-notice {
	display: none;
	position: absolute;
	left: 16px;
	right: 16px;
	bottom: 8%;
	max-width: 560px;
	margin: 0 auto;
	padding: 1rem;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	font: 15px/1.4 system-ui, sans-serif;
	text-align: center;
	z-index: 2;
}

#status {
	background: radial-gradient(ellipse at 50% 120%, #121522 0%, #03040a 60%);
	font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;

.glow {
	position: absolute;
	left: 50%;
	bottom: 30vh;
	width: calc(30vmin + var(--p) * 150vmin);
	height: calc(30vmin + var(--p) * 150vmin);
	transform: translate(-50%, 50%);
	border-radius: 50%;
	background: radial-gradient(circle, rgba(255, 220, 160, 0.55) 0%, rgba(255, 160, 80, 0.18) 35%, rgba(255, 138, 61, 0) 70%);
	opacity: calc(0.35 + var(--p) * 0.65);
	transition: width 0.3s, height 0.3s;
}

.ground {
	position: absolute;
	left: -30%;
	right: -30%;
	bottom: -70vh;
	height: 100vh;
	border-radius: 50%;
	background: radial-gradient(ellipse at 50% 0%, rgba(170, 130, 90, calc(0.15 + var(--p) * 0.6)) 0%, rgba(70, 55, 42, 0.2) 18%, rgba(0, 0, 0, 0) 40%), #17130f;
}

.lamp {
	position: absolute;
	left: 50%;
	bottom: 30vh;
	width: 6px;
	height: 16vh;
	transform: translateX(-50%);
	background: linear-gradient(90deg, #6f6a63, #c2bbb1);
}

.lamp::before {
	content: '';
	position: absolute;
	left: 50%;
	top: -14px;
	width: 22px;
	height: 22px;
	margin-left: -11px;
	border-radius: 50%;
	background: #fff3d6;
	box-shadow: 0 0 calc(10px + var(--p) * 40px) calc(2px + var(--p) * 10px) rgba(255, 200, 120, 0.8);
	animation: flicker 3s steps(1) infinite;
}

@keyframes flicker {
	0%, 100% { opacity: 1; }
	47% { opacity: 0.7; }
	49% { opacity: 1; }
	83% { opacity: 0.85; }
}

/* Spiders wait out at the edge of the light, and back off as it grows. */
.eyes {
	position: absolute;
	bottom: calc(31vh + var(--y));
	left: calc(50% + var(--x) * (12vw + var(--p) * 34vw));
	width: 4px;
	height: 4px;
	border-radius: 50%;
	background: #ff3b2f;
	box-shadow: 9px 0 #ff3b2f, 0 0 6px 1px rgba(255, 40, 30, 0.6), 9px 0 6px 1px rgba(255, 40, 30, 0.6);
	opacity: calc(1 - var(--p));
	animation: blink 4s infinite;
	animation-delay: var(--d);
	transition: left 0.4s;
}

@keyframes blink {
	0%, 92%, 100% { transform: scaleY(1); }
	95% { transform: scaleY(0.1); }
}

.front {
	position: absolute;
	left: 0;
	right: 0;
	top: 14vh;
	padding: 0 16px;
	display: flex;
	flex-direction: column;
	align-items: center;
	text-align: center;
}

.title {
	font-size: clamp(30px, 8vw, 76px);
	font-weight: 800;
	letter-spacing: 0.28em;
	margin-right: -0.28em;
	color: #ff8a3d;
	text-shadow: 0 0 24px rgba(255, 138, 61, 0.45);
}

.tag {
	margin-top: 10px;
	font-size: clamp(14px, 2.2vw, 18px);
	color: #b8b0a6;
}

.bar {
	position: relative;
	width: min(420px, 100%);
	height: 3px;
	margin-top: 34px;
	background: rgba(255, 255, 255, 0.12);
}

.bar b {
	position: absolute;
	inset: 0;
	width: calc(var(--p) * 100%);
	background: #ff8a3d;
	box-shadow: 0 0 10px #ff8a3d;
	transition: width 0.2s;
}

.busy .bar b {
	width: 30%;
	animation: sweep 1.2s ease-in-out infinite alternate;
}

@keyframes sweep {
	to { transform: translateX(233%); }
}

#status-caption {
	margin-top: 12px;
	font-size: 12px;
	letter-spacing: 0.3em;
	color: #8a837a;
	text-transform: uppercase;
}

	<body>
		<canvas id="canvas">

		<div id="status" style="--p: 0">
			<div class="sky"></div>
			<div class="glow"></div>
			<div class="ground"></div>
			<div class="lamp"></div>
			<div class="eyes" style="--x: -1; --y: 1vh; --d: 0s"></div>
			<div class="eyes" style="--x: -1.25; --y: 4vh; --d: 1.3s"></div>
			<div class="eyes" style="--x: 1; --y: 2vh; --d: 0.6s"></div>
			<div class="eyes" style="--x: 1.4; --y: 6vh; --d: 2.2s"></div>
			<div class="front">
				<div class="title">ROCKHOPPER</div>
				<div class="tag">Co-op mining on a turning asteroid. The dark is the enemy.</div>
				<div class="bar"><b></b></div>
				<div id="status-caption">Lighting the lamps</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const statusCaption = document.getElementById('status-caption');

	let initializing = true;
	let statusMode = '';

	function onProgress(fraction) {

	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const f = Math.min(1, current / total);
			statusOverlay.classList.remove('busy');
			statusOverlay.style.setProperty('--p', f.toFixed(4));
			statusCaption.textContent = f >= 1 ? 'Dropping the pod' : 'Lighting the lamps %'.replace('%', Math.floor(f * 100) + '%');
			onProgress(f);
		} else {
			statusOverlay.classList.add('busy');
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 600);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
