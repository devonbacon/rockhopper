vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include="<script>
(() => {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (!AC) return;
	const ctxs = window.__audioCtxs = [];
	class Tracked extends AC { constructor(...a) { super(...a); ctxs.push(this); } }
	window.AudioContext = window.webkitAudioContext = Tracked;
	const resume = () => { for (const c of ctxs) if (c.state === 'suspended') c.resume(); };
	for (const e of ['pointerdown', 'pointerup', 'keydown', 'touchend', 'click']) window.addEventListener(e, resume, true);
})();
</script>"
